apply plugin: 'com.android.application'

android {
    namespace = "com.delulu.college.app"
    compileSdk = rootProject.ext.compileSdkVersion

    // Release signing: uses keystore + env vars when available.
    // CRITICAL: Release builds MUST be signed with release keystore for Play Store.
    // Set environment variables before building:
    // export RELEASE_STORE_PASSWORD="your_keystore_password"
    // export RELEASE_KEY_ALIAS="delulu"
    // export RELEASE_KEY_PASSWORD="your_key_password"
    def releaseKeystoreFile = rootProject.file('keystore/delulu-release.keystore')
    def hasReleaseKeystore = releaseKeystoreFile.exists()
        && System.getenv('RELEASE_STORE_PASSWORD')
        && System.getenv('RELEASE_KEY_ALIAS')

    // A release artifact is a distribution contract: Android will reject future
    // updates if its signing certificate changes. Never silently fall back to a
    // machine-local debug key for an assembleRelease/bundleRelease invocation.
    def isReleaseTask = gradle.startParameter.taskNames.any { taskName ->
        taskName.toLowerCase().contains('release')
    }
    if (isReleaseTask && !hasReleaseKeystore) {
        throw new GradleException(
            'Release signing is not configured. Set RELEASE_STORE_PASSWORD, ' +
            'RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD, and provide ' +
            'android/keystore/delulu-release.keystore. Use assembleDebug for local testing.'
        )
    }

    signingConfigs {
        release {
            storeFile releaseKeystoreFile
            storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: 'delulu'
            keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: System.getenv('RELEASE_STORE_PASSWORD') ?: ''
        }
    }

    def configuredVersionCode = (project.findProperty('DELULU_VERSION_CODE') ?: '100').toString()
    if (!(configuredVersionCode ==~ /[1-9][0-9]*/)) {
        throw new GradleException('DELULU_VERSION_CODE must be a positive integer.')
    }
    def configuredVersionName = (project.findProperty('DELULU_VERSION_NAME') ?: '1.0.0').toString()
    if (configuredVersionName.trim().isEmpty()) {
        throw new GradleException('DELULU_VERSION_NAME must not be empty.')
    }

    defaultConfig {
        applicationId "com.delulu.college.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode configuredVersionCode.toInteger()
        versionName configuredVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase Messaging — required for DeluluMessagingService (FirebaseMessagingService, RemoteMessage)
    implementation 'com.google.firebase:firebase-messaging:24.1.1'
}

apply from: 'capacitor.build.gradle'

// CRITICAL: google-services.json MUST exist and be valid for FCM push notifications.
// If the file is missing or invalid, the build SHOULD fail explicitly rather than
// silently continuing with broken push notification functionality.
apply plugin: 'com.google.gms.google-services'
