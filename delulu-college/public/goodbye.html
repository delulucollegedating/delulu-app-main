<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account Deleted - Delulu</title>
  <link rel="stylesheet" href="/css/tailwind.css"/>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      color: #38190B;
      background: #FAF6F0;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      max-width: 500px;
      text-align: center;
      background: white;
      padding: 48px 40px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #85431E;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    p {
      margin-bottom: 16px;
      color: #6B5147;
    }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      background: #85431E;
      color: white;
      margin-top: 24px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #6B3418;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Your account has been deleted</h1>
    <p>We're sorry to see you go. Your account and all associated data have been permanently removed from Delulu.</p>
    <p>If you change your mind in the future, you're always welcome to create a new account.</p>
    <p>Thank you for being part of our community.</p>
    <a href="/" class="btn">Return to Home</a>
  </div>
</body>
</html>
