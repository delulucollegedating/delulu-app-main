apply plugin: 'com.android.application'

android {
    namespace = "com.delulu.college.app"
    compileSdk = rootProject.ext.compileSdkVersion

    // Release signing: uses keystore + env vars when available.
    // CRITICAL: Release builds MUST be signed with release keystore for Play Store.
    // Set environment variables before building:
    // export RELEASE_STORE_PASSWORD="your_keystore_password"
    // export RELEASE_KEY_ALIAS="delulu"
    // export RELEASE_KEY_PASSWORD="your_key_password"
    def releaseKeystoreFile = rootProject.file('keystore/delulu-release.keystore')
    def hasReleaseKeystore = releaseKeystoreFile.exists()
        && System.getenv('RELEASE_STORE_PASSWORD')
        && System.getenv('RELEASE_KEY_ALIAS')

    signingConfigs {
        release {
            storeFile releaseKeystoreFile
            storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: 'delulu'
            keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: System.getenv('RELEASE_STORE_PASSWORD') ?: ''
        }
    }

    defaultConfig {
        applicationId "com.delulu.college.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 100
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // CRITICAL: Release builds MUST use release keystore, never debug
            // This prevents accidental debug signing which breaks future updates
            if (!hasReleaseKeystore) {
                throw new GradleException(
                    "❌ Release keystore not configured!\n\n" +
                    "Set these environment variables before building:\n" +
                    "  export RELEASE_STORE_PASSWORD='your_keystore_password'\n" +
                    "  export RELEASE_KEY_ALIAS='delulu'\n" +
                    "  export RELEASE_KEY_PASSWORD='your_key_password'\n\n" +
                    "Keystore location: android/keystore/delulu-release.keystore\n" +
                    "Generate with: keytool -genkey -v -keystore android/keystore/delulu-release.keystore " +
                    "-alias delulu -keyalg RSA -keysize 2048 -validity 10000"
                )
            }
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase Messaging — required for DeluluMessagingService (FirebaseMessagingService, RemoteMessage)
    implementation 'com.google.firebase:firebase-messaging:24.1.1'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
