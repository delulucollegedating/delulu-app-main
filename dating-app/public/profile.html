<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <script>(function(){if(localStorage.getItem('delulu_theme')==='dark'){document.documentElement.classList.add('dark');}else{document.documentElement.classList.remove('dark');}})();</script>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
  <title>Delulu - Profile</title>
  <meta name="robots" content="noindex, nofollow"/>
  
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link rel="dns-prefetch" href="//fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <link rel="stylesheet" href="css/tailwind.css">
  <script type="speculationrules">
    {
      "prefetch": [
        {
          "where": {
            "and": [
              { "href_matches": "/*" },
              { "not": { "href_matches": "/logout" } },
              { "not": { "href_matches": "/api/*" } }
            ]
          },
          "eagerness": "eager"
        }
      ],
      "prerender": [
        {
          "where": {
            "and": [
              { "href_matches": "/*" },
              { "not": { "href_matches": "/logout" } },
              { "not": { "href_matches": "/api/*" } }
            ]
          },
          "eagerness": "moderate"
        }
      ]
    }
  </script>
  <link rel="stylesheet" href="styles.css?v=284">
  <style>
    #nav-profile, #mnav-profile {
      color: #a53b29;
    }
  </style>
</head>
<body class="profile-page bg-background text-on-background min-h-screen flex flex-col pt-16 md:pt-24 pb-24 md:pb-6 antialiased">
  
  <header id="global-header" class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 md:px-16 py-3 md:py-4 bg-surface/80 backdrop-blur-xl shadow-sm">
    <div class="flex items-center gap-2 font-bold text-2xl text-primary tracking-tight">
      <img src="logo.png" class="w-7 h-7 rounded-lg object-cover" alt="Delulu">
      <span>Delulu</span>
    </div>
    <nav class="hidden md:flex gap-8 items-center font-semibold text-sm">
      <a href="discover.html" class="nav-link text-on-surface-variant hover:text-primary transition-colors" id="nav-discover">Discover</a>
      <a href="requests.html" class="nav-link text-on-surface-variant hover:text-primary transition-colors" id="nav-requests">Requests</a>
      <a href="messages.html" class="nav-link text-on-surface-variant hover:text-primary transition-colors" id="nav-messages">Messages</a>
      <a href="profile.html" class="nav-link transition-colors" id="nav-profile">Profile</a>
    </nav>
    <div class="flex items-center gap-2">
      <button id="theme-toggle" class="w-9 h-9 rounded-full text-on-surface-variant hover:text-primary flex items-center justify-center transition-colors" title="Toggle theme">
        <span class="material-symbols-outlined text-sm">dark_mode</span>
      </button>
      <button id="logout-btn" class="text-on-surface-variant hover:text-primary text-sm font-semibold transition-colors">Logout</button>
      <div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant/30 bg-primary/20 flex items-center justify-center text-primary font-bold" id="header-avatar"></div>
    </div>
  </header>

  <nav id="mobile-nav" class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 bg-surface/90 backdrop-blur-xl border-t border-outline-variant/20">
    <a href="discover.html" class="nav-link flex flex-col items-center text-on-surface-variant hover:text-primary transition-all" id="mnav-discover">
      <span class="material-symbols-outlined">explore</span><span class="text-[10px] mt-1 font-semibold">Discover</span>
    </a>
    <a href="requests.html" class="nav-link flex flex-col items-center text-on-surface-variant hover:text-primary transition-all" id="mnav-requests">
      <span class="material-symbols-outlined">person_add</span><span class="text-[10px] mt-1 font-semibold">Requests</span>
    </a>
    <a href="messages.html" class="nav-link flex flex-col items-center text-on-surface-variant hover:text-primary transition-all" id="mnav-messages">
      <span class="material-symbols-outlined">chat_bubble</span><span class="text-[10px] mt-1 font-semibold">Messages</span>
    </a>
    <a href="profile.html" class="nav-link flex flex-col items-center transition-all" id="mnav-profile">
      <span class="material-symbols-outlined">person</span><span class="text-[10px] mt-1 font-semibold">Profile</span>
    </a>
  </nav>

  <main class="flex-grow flex flex-col w-full px-6 relative" id="app-root">
    <div class="w-full max-w-5xl mx-auto pt-0 pb-0">
      <div class="flex items-center justify-between mb-2 mt-2">
        <h1 class="text-xl md:text-2xl font-bold text-primary">My Profile</h1>
        <a href="settings.html" id="btn-settings" class="w-10 h-10 rounded-full bg-surface-container-low hover:bg-primary/10 text-on-surface-variant hover:text-primary flex items-center justify-center transition-all shadow-sm border border-outline-variant/30 active:scale-95" title="Account Settings" aria-label="Account Settings">
          <span class="material-symbols-outlined text-xl">settings</span>
        </a>
      </div>
      
      <div class="flex flex-col md:flex-row md:items-center md:justify-between md:gap-6 w-full min-h-[460px] relative">
        <!-- Left Column: Form -->
        <div class="w-full md:w-[60%] lg:w-[64%] max-w-[660px] flex-shrink-0 glass-panel p-5 rounded-3xl ambient-shadow relative overflow-hidden z-10">
          <!-- Decoration -->
          <div class="absolute -top-12 -right-12 w-32 h-32 bg-primary/10 rounded-full blur-2xl"></div>
          <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-secondary/10 rounded-full blur-2xl"></div>
        
          <form id="profile-form" class="relative z-10 flex flex-col gap-3">
            <div class="flex items-center gap-4 mb-1">
              <div id="prof-avatar" class="w-20 h-20 rounded-full bg-primary-container text-white flex items-center justify-center overflow-hidden border-2 border-outline-variant/30 text-4xl shadow-sm relative"></div>
              <div>
                <h2 id="prof-username" class="text-2xl font-bold text-on-surface capitalize">...</h2>
                <p class="text-sm text-on-surface-variant font-semibold mt-1">Identity protected</p>
              </div>
            </div>
            
            <div class="space-y-1">
              <label class="text-sm font-bold text-on-surface-variant pl-2">Bio</label>
              <textarea id="prof-bio" class="w-full bg-surface-container-low rounded-xl px-4 py-2 border-none focus:ring-2 focus:ring-primary/50 outline-none resize-none" placeholder="Tell them about you..."></textarea>
            </div>
            
            <div class="space-y-1">
              <label class="text-sm font-bold text-on-surface-variant pl-2">Hobbies (comma separated)</label>
              <input id="prof-hobbies" type="text" class="w-full bg-surface-container-low rounded-xl px-4 py-2 border-none focus:ring-2 focus:ring-primary/50 outline-none" placeholder="e.g. reading, hiking, coffee">
            </div>
            
            <div class="space-y-1">
              <label class="text-sm font-bold text-on-surface-variant pl-2">Select Avatar</label>
              <div id="prof-avatar-grid" class="grid grid-cols-6 gap-2 overflow-y-auto p-2 border border-outline-variant/30 rounded-xl bg-surface-container-low custom-scrollbar">
                <!-- Dynamically populated -->
              </div>
              <input type="hidden" id="prof-avatar-input" required>
            </div>
            
            <p id="prof-msg" class="text-sm font-semibold hidden"></p>
            <button type="submit" class="w-full mt-1 bg-gradient-to-r from-primary to-primary-container text-white font-bold py-2 rounded-xl shadow-md hover:shadow-lg transition-all text-sm">Save Changes</button>
          </form>
        </div>
        
        <!-- Right Column: 3D Preview (No card, borderless, transparent, absolutely positioned) -->
        <div id="profile-3d-preview-container" class="absolute right-0 bottom-0 md:right-8 md:bottom-4 z-0 pointer-events-none opacity-85 md:opacity-100 flex items-center justify-center">
          <div id="profile-3d-preview" class="relative flex items-center justify-center">
            <!-- Injected via JS -->
          </div>
        </div>
      </div>
      
    </div>
  </div>
  </main>
  
  <script src="js/three.min.js"></script>
  <link rel="preload" href="js/shared.js?v=286" as="script">
  <script src="js/profanity-words.generated.js"></script>
  <script src="js/shared.js?v=286"></script>
  <script src="js/image-compress.js?v=243"></script>
  <script src="js/profile.js?v=285"></script>
</body>
</html>
