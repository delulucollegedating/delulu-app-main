<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Instant theme bootstrap -->
  <script>(function(){if(localStorage.getItem('delulu_theme')==='dark'){document.documentElement.classList.add('dark');}else{document.documentElement.classList.remove('dark');}})();</script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Delulu</title>
  <meta name="theme-color" content="#85431E"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-cream: #EACEAA;
      --color-terracotta: #85431E;
      --color-caramel: #D39858;
      --bg-dark: #0f0704;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 38%, rgba(211, 152, 88, 0.28) 0%, rgba(133, 67, 30, 0.42) 38%, #140804 75%, #0a0402 100%);
      opacity: 1;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 99999;
      user-select: none;
    }

    #splash.fade-out {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    /* Ambient Warm Glow Aura */
    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(211, 152, 88, 0.35) 0%, rgba(133, 67, 30, 0.2) 50%, transparent 70%);
      filter: blur(40px);
      animation: ambientPulse 3.5s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes ambientPulse {
      0% { transform: scale(0.88); opacity: 0.65; }
      100% { transform: scale(1.18); opacity: 1; }
    }

    .content-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 24px;
    }

    /* Aesthetic Logo Frame */
    .logo-frame {
      position: relative;
      width: 116px;
      height: 116px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: logoEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .logo-ring {
      position: absolute;
      inset: -6px;
      border-radius: 34px;
      background: linear-gradient(135deg, rgba(234, 206, 170, 0.45), rgba(211, 152, 88, 0.2), rgba(133, 67, 30, 0.6));
      padding: 1.5px;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: ringShine 4s linear infinite;
    }

    .logo-img {
      width: 110px;
      height: 110px;
      border-radius: 30px;
      object-fit: cover;
      box-shadow: 
        0 14px 34px -8px rgba(133, 67, 30, 0.65),
        0 6px 20px rgba(0, 0, 0, 0.7),
        inset 0 1px 1px rgba(234, 206, 170, 0.3);
      border: 1px solid rgba(234, 206, 170, 0.18);
    }

    @keyframes logoEntrance {
      0% { opacity: 0; transform: scale(0.75) translateY(14px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Brand Name */
    .brand-title {
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -1.2px;
      background: linear-gradient(135deg, #FFF8F0 0%, #EACEAA 55%, #D39858 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 14px rgba(211, 152, 88, 0.3));
      margin-bottom: 8px;
      animation: fadeInUp 0.7s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Primary Tagline */
    .brand-subtitle {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.15px;
      color: var(--color-cream);
      opacity: 0.9;
      margin-bottom: 14px;
      animation: fadeInUp 0.7s 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Secondary Aesthetic Badge */
    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 15px;
      border-radius: 100px;
      background: rgba(133, 67, 30, 0.28);
      border: 1px solid rgba(211, 152, 88, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 18px -2px rgba(133, 67, 30, 0.3);
      animation: fadeInUp 0.7s 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .badge-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--color-caramel);
      box-shadow: 0 0 8px var(--color-caramel);
      animation: dotGlow 2s ease-in-out infinite alternate;
    }

    @keyframes dotGlow {
      0% { opacity: 0.5; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    .badge-text {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--color-cream);
    }

    /* Luxury Shimmer Loader */
    .loader-wrap {
      position: absolute;
      bottom: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: fadeIn 0.8s 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .shimmer-track {
      width: 120px;
      height: 3px;
      border-radius: 100px;
      background: rgba(234, 206, 170, 0.12);
      overflow: hidden;
      position: relative;
    }

    .shimmer-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, transparent, var(--color-caramel), var(--color-cream), transparent);
      border-radius: 100px;
      animation: luxuryShimmer 1.7s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes luxuryShimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="ambient-glow"></div>
    
    <div class="content-container">
      <div class="logo-frame">
        <div class="logo-ring"></div>
        <img class="logo-img" src="/logo.png" alt="Delulu" onerror="this.src='/favicon.png'"/>
      </div>
      
      <h1 class="brand-title">delulu</h1>
      <p class="brand-subtitle">college connections, but make it fun</p>
      
      <div class="pill-badge">
        <span class="badge-dot"></span>
        <span class="badge-text">talk first &bull; judge never</span>
      </div>
    </div>

    <div class="loader-wrap">
      <div class="shimmer-track">
        <div class="shimmer-bar"></div>
      </div>
    </div>
  </div>

  <script>
    const MIN_SPLASH_MS = 1600;
    const startedAt = Date.now();

    function navigateTo(url) {
      const elapsed = Date.now() - startedAt;
      const remaining = Math.max(0, MIN_SPLASH_MS - elapsed);
      setTimeout(() => {
        const splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('fade-out');
          setTimeout(() => { window.location.replace(url); }, 460);
        } else {
          window.location.replace(url);
        }
      }, remaining);
    }

    const SESSION_VERIFIED_KEY = 'session_verified_at';
    const SESSION_VERIFY_TTL_MS = 5 * 60 * 1000;

    function isSessionFresh() {
      try {
        const t = Number(localStorage.getItem(SESSION_VERIFIED_KEY));
        return t && (Date.now() - t) < SESSION_VERIFY_TTL_MS;
      } catch(e) { return false; }
    }

    async function getStoredAuthToken() {
      try {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences) {
          const { value } = await window.Capacitor.Plugins.Preferences.get({ key: 'auth_token' });
          if (value) return value;
        }
      } catch(e) {}
      return null;
    }

    async function checkSession() {
      const cachedUser = localStorage.getItem('cached_user');

      // Fast path: cached + recently verified — skip network, go straight to app
      if (cachedUser && isSessionFresh()) {
        navigateTo('discover.html');
        return;
      }

      if (cachedUser) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 4000);
        try {
          const headers = { 'Content-Type': 'application/json' };
          const token = await getStoredAuthToken();
          if (token) headers['Authorization'] = 'Bearer ' + token;

          const isNative = window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform();
          const apiBase = (!isNative) ? '' :
            ((window.Capacitor && window.Capacitor.config &&
              window.Capacitor.config.plugins &&
              window.Capacitor.config.plugins.Config &&
              window.Capacitor.config.plugins.Config.apiBaseUrl) ||
             'https://delulu-app-main-production.up.railway.app');

          const res = await fetch(apiBase + '/api/session', {
            method: 'GET',
            headers,
            credentials: isNative ? 'omit' : 'include',
            signal: controller.signal
          });
          clearTimeout(timeout);

          if (res.ok) {
            const data = await res.json();
            if (data.authenticated && data.user) {
              localStorage.setItem('cached_user', JSON.stringify(data.user));
              localStorage.setItem(SESSION_VERIFIED_KEY, String(Date.now()));
              if (data.token) {
                try {
                  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences) {
                    await window.Capacitor.Plugins.Preferences.set({ key: 'auth_token', value: data.token });
                  }
                } catch(e) {}
              }
              navigateTo('discover.html');
              return;
            } else if (data.authenticated === false) {
              localStorage.removeItem('cached_user');
              localStorage.removeItem(SESSION_VERIFIED_KEY);
              localStorage.removeItem('e2ee_private_key');
              navigateTo('login.html');
              return;
            }
          }
        } catch(e) {
          clearTimeout(timeout);
          // Network error / timeout / offline — trust cache, go to app
          navigateTo('discover.html');
          return;
        }
        // Fallback with cached user
        navigateTo('discover.html');
        return;
      }

      // No cached user — go to login
      navigateTo('login.html');
    }

    function run() {
      checkSession().catch(() => navigateTo('login.html'));
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', run);
    } else {
      run();
    }
  </script>
</body>
</html>
