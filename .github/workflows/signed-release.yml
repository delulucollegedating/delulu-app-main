name: Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name to publish (for example, 1.0.1)
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: delulu-college
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: delulu-college/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: |
          npm run build:css
          npx cap sync android
      - name: Restore private release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/keystore/delulu-release.keystore
          chmod 600 android/keystore/delulu-release.keystore
      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: cd android && ./gradlew :app:assembleRelease -PDELULU_VERSION_NAME="${{ inputs.version_name }}" -PDELULU_VERSION_CODE="${{ inputs.version_code }}"
      - uses: actions/upload-artifact@v4
        with:
          name: delulu-${{ inputs.version_name }}-signed
          path: delulu-college/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
