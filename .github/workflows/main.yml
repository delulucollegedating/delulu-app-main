name: Build Android Debug APK

# App root is dating-app/ (package.json, capacitor.config.json, android/ all live there,
# NOT at the repository root). Every step below sets working-directory explicitly.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dating-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dating-app/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found — using npm ci"
            npm ci
          else
            echo "No package-lock.json found — using npm install"
            npm install
          fi

      - name: Regenerate Android native project
        run: |
          # The android/ directory is gitignored (only a hand-written MainActivity.java
          # is checked in), so the native project is not fully present in the repo.
          # It must be regenerated by Capacitor on every run.
          if [ -d android ]; then
            echo "Removing incomplete/stale android/ directory before regenerating"
            rm -rf android
          fi
          npx cap add android

      - name: Sync web assets + native plugins into Android project
        run: npx cap sync android

      - name: Apply custom MainActivity (screen-security flag + notification channel)
        run: |
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          PKG_PATH=$(echo "$APP_ID" | tr '.' '/')
          TARGET_DIR="android/app/src/main/java/$PKG_PATH"
          mkdir -p "$TARGET_DIR"
          cat > "$TARGET_DIR/MainActivity.java" << EOF
          package ${APP_ID};

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // Prevent screenshots and screen recording across the app for privacy
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );

                  // Create high-importance notification channel for Delulu messages (Android 8+)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          "delulu_messages",
                          "Delulu Chat Messages",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      channel.setDescription("Notifications for incoming chat messages and connections");
                      channel.enableVibration(true);
                      channel.setShowBadge(true);
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }
          }
          EOF
          echo "Wrote MainActivity.java to $TARGET_DIR (package $APP_ID)"

      - name: Build debug APK
        working-directory: dating-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Locate generated APK
        working-directory: dating-app/android
        run: find app/build/outputs/apk -name "*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: delulu-debug-apk
          path: dating-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
